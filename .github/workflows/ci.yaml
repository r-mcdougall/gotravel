name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test

  image:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [auth, catalog, booking, payment]
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg SERVICE=${{ matrix.service }} -t gotravel-${{ matrix.service }}:ci .