version: "2"

linters:
  # Default set: errcheck, govet, ineffassign, staticcheck, unused.
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - nolintlint
    - sqlclosecheck
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/r-mcdougall/gotravel
