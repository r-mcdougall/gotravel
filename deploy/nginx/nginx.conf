worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    default_type application/json;
    charset utf-8;

    # Docker DNS; lets upstreams with "resolve" start before services exist.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format json escape=json
        '{'
            '"time":"$time_iso8601",'
            '"request_id":"$req_id",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$body_bytes_sent,'
            '"duration_s":$request_time,'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"user_agent":"$http_user_agent"'
        '}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $req_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;

    upstream auth {
        zone upstream_auth 64k;
        server auth:8080 resolve;
        keepalive 16;
    }

    upstream catalog {
        zone upstream_catalog 64k;
        server catalog:8080 resolve;
        keepalive 16;
    }

    upstream booking {
        zone upstream_booking 64k;
        server booking:8080 resolve;
        keepalive 16;
    }

    upstream payment {
        zone upstream_payment 64k;
        server payment:8080 resolve;
        keepalive 16;
    }

    server {
        listen 80;

        add_header X-Request-ID $req_id always;

        location = /healthz {
            access_log off;
            return 200 '{"status":"ok"}';
        }

        location ~ ^/api/v1/(auth|users)(/|$) {
            proxy_pass http://auth;
        }

        location ~ ^/api/v1/(flights|admin/flights|hotels|admin/hotels)(/|$) {
            proxy_pass http://catalog;
        }

        location ~ ^/api/v1/(bookings|hotel-bookings|admin/analytics/bookings)(/|$) {
            proxy_pass http://booking;
        }

        location ~ ^/api/v1/payments(/|$) {
            proxy_pass http://payment;
        }

        location / {
            return 404 '{"error":{"code":"NOT_FOUND","message":"route not found"}}';
        }

        error_page 502 503 504 = @upstream_unavailable;
        location @upstream_unavailable {
            return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"service temporarily unavailable"}}';
        }
    }
}
