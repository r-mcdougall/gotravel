global:
  scrape_interval: 15s

scrape_configs:
  - job_name: auth
    static_configs:
      - targets: ["auth:8080"]

  - job_name: catalog
    static_configs:
      - targets: ["catalog:8080"]

  - job_name: booking
    static_configs:
      - targets: ["booking:8080"]

  - job_name: payment
    static_configs:
      - targets: ["payment:8080"]

  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]
