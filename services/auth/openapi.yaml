openapi: 3.1.0
info:
  title: GoTravel Auth API
  version: 1.0.0
  description: >
    User registration, login, token refresh and profile management.
    Access tokens are EdDSA-signed JWTs valid for 15 minutes. Refresh tokens
    are opaque, valid for 7 days, and rotated on every use.

tags:
  - name: auth
  - name: users

paths:
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      description: Always creates a user with role `user`.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Email is already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: EMAIL_TAKEN
                  message: email is already registered
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Log in
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Token pair issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Unknown email or wrong password. Both cases return the same error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: invalid email or password
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token and issue a new token pair
      description: >
        The submitted refresh token is revoked and a new pair is returned.
        Presenting an already revoked token revokes every refresh token of
        that user.
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New token pair issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Refresh token is unknown, expired or revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVALID_REFRESH_TOKEN
                  message: refresh token is invalid or expired
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token
      description: >
        Idempotent: unknown or already revoked tokens also return 204.
        Access tokens already issued stay valid until they expire.
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Logged out.
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/me:
    get:
      tags: [users]
      summary: Get the current user's profile
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [users]
      summary: Update the current user's profile
      description: >
        Omitted fields are left unchanged. Sending `"phone": null` removes
        the phone number.
      operationId: updateMe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ValidationError:
      description: Malformed JSON, unknown field or invalid value.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_ERROR
              message: request validation failed
              details:
                - field: email
                  message: must be a valid email address
    Unauthorized:
      description: Access token is missing, invalid or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAUTHORIZED
              message: missing or invalid access token
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INTERNAL_ERROR
              message: internal server error

  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lowercased by the server.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Length is measured in bytes (bcrypt limit), 8 to 72.
        full_name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed by the server.
        phone:
          type: string
          pattern: "^\\+?[0-9]{8,15}$"
          example: "+6281234567890"

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          maxLength: 72

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1

    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: [string, "null"]
          pattern: "^\\+?[0-9]{8,15}$"
          example: "+6281234567890"

    User:
      type: object
      required: [id, email, full_name, phone, role, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        phone:
          type: [string, "null"]
        role:
          type: string
          enum: [user, admin]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TokenPair:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - refresh_token
        - refresh_expires_in
      properties:
        access_token:
          type: string
          description: EdDSA-signed JWT.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
          example: 900
        refresh_token:
          type: string
          description: Opaque token, 32 random bytes encoded as base64url.
        refresh_expires_in:
          type: integer
          description: Refresh token lifetime in seconds.
          example: 604800

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - EMAIL_TAKEN
                - INVALID_CREDENTIALS
                - INVALID_REFRESH_TOKEN
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - INTERNAL_ERROR
            message:
              type: string
            details:
              type: array
              description: Present on VALIDATION_ERROR only.
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string