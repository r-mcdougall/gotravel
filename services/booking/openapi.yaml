openapi: 3.1.0
info:
  title: GoTravel Booking API
  version: 1.0.0
  description: >
    Seat holds and the booking lifecycle. Every route requires an access token
    issued by the auth service. A booking belongs to the user in the token;
    other users' bookings are reported as not found. Times are in UTC.

tags:
  - name: bookings
    description: Holds and bookings of the signed-in user.

servers:
  - url: http://localhost:8080
    description: Local gateway

security:
  - bearerAuth: []

paths:
  /api/v1/bookings:
    post:
      tags: [bookings]
      summary: Hold seats
      description: >
        Reserves one seat per passenger on an upcoming flight and returns a
        `HELD` booking. The hold expires at `expires_at` (15 minutes by
        default) unless it is paid. The seat price is fixed when the hold is
        made. Seats are reserved atomically, so two holds never share a seat.
        A flight is known to booking once the catalog has published it.
      operationId: holdSeats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldRequest"
      responses:
        "201":
          description: Seats held.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No flight has this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: NOT_FOUND
                  message: flight not found
        "409":
          description: >
            The flight has already departed (`FLIGHT_DEPARTED`), or it has
            fewer free seats than passengers (`NOT_ENOUGH_SEATS`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                flightDeparted:
                  summary: The flight has already departed
                  value:
                    error:
                      code: FLIGHT_DEPARTED
                      message: the flight has already departed
                notEnoughSeats:
                  summary: Not enough free seats for every passenger
                  value:
                    error:
                      code: NOT_ENOUGH_SEATS
                      message: not enough seats are available for every passenger
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [bookings]
      summary: List my bookings
      description: Bookings of the signed-in user in every status, newest first.
      operationId: listBookings
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A page of bookings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/bookings/{id}:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    get:
      tags: [bookings]
      summary: Get a booking
      operationId: getBooking
      responses:
        "200":
          description: The booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/bookings/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    post:
      tags: [bookings]
      summary: Cancel a hold
      description: >
        Cancels a `HELD` booking and releases its seats. Confirmed, expired
        and cancelled bookings cannot be cancelled.
      operationId: cancelBooking
      responses:
        "200":
          description: The cancelled booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The booking is not held.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: BOOKING_NOT_HELD
                  message: only a held booking can be cancelled
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BookingId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Malformed JSON, unknown field, or an invalid value in the body or the query string.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_ERROR
              message: request validation failed
              details:
                - field: passengers[0].birth_date
                  message: must be a past date in YYYY-MM-DD format
    Unauthorized:
      description: Access token is missing, invalid or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAUTHORIZED
              message: missing or invalid access token
    NotFound:
      description: >
        The signed-in user has no booking with this id. Bookings of other users
        and malformed ids are also reported as not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: NOT_FOUND
              message: booking not found
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INTERNAL_ERROR
              message: internal server error

  schemas:
    HoldRequest:
      type: object
      additionalProperties: false
      required: [flight_id, passengers]
      properties:
        flight_id:
          type: string
          format: uuid
        passengers:
          type: array
          minItems: 1
          maxItems: 9
          description: One seat is held per passenger.
          items:
            $ref: "#/components/schemas/PassengerRequest"

    PassengerRequest:
      type: object
      additionalProperties: false
      required: [full_name, birth_date]
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 100
          description: Surrounding spaces are trimmed.
          example: Jane Smith
        birth_date:
          type: string
          format: date
          description: Not in the future.
          example: "1992-08-03"

    Passenger:
      type: object
      required: [full_name, birth_date]
      properties:
        full_name:
          type: string
          example: Jane Smith
        birth_date:
          type: string
          format: date
          example: "1992-08-03"

    BookingStatus:
      type: string
      description: >
        `HELD` until paid, cancelled or expired. `CONFIRMED` and `EXPIRED` are
        set by the payment flow and the hold expirer.
      enum: [HELD, CONFIRMED, EXPIRED, CANCELLED]

    BookingFlight:
      type: object
      required:
        - id
        - flight_number
        - airline_code
        - origin_code
        - destination_code
        - departure_at
        - arrival_at
      properties:
        id:
          type: string
          format: uuid
        flight_number:
          type: string
          example: GA410
        airline_code:
          type: string
          example: GA
        origin_code:
          type: string
          example: CGK
        destination_code:
          type: string
          example: DPS
        departure_at:
          type: string
          format: date-time
          example: "2026-11-19T23:00:00Z"
        arrival_at:
          type: string
          format: date-time
          example: "2026-11-20T00:55:00Z"

    Booking:
      type: object
      required:
        - id
        - status
        - flight
        - passengers
        - passenger_count
        - seat_price
        - total_price
        - expires_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/BookingStatus"
        flight:
          $ref: "#/components/schemas/BookingFlight"
        passengers:
          type: array
          items:
            $ref: "#/components/schemas/Passenger"
        passenger_count:
          type: integer
          example: 2
        seat_price:
          type: integer
          format: int64
          description: Price per seat in rupiah, fixed when the hold was made.
          example: 1250000
        total_price:
          type: integer
          format: int64
          description: "`seat_price` times `passenger_count`."
          example: 2500000
        expires_at:
          type: string
          format: date-time
          description: When an unpaid hold expires.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          description: Number of the user's bookings across all pages.

    BookingList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        meta:
          $ref: "#/components/schemas/PageMeta"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - NOT_FOUND
                - FLIGHT_DEPARTED
                - NOT_ENOUGH_SEATS
                - BOOKING_NOT_HELD
                - INTERNAL_ERROR
            message:
              type: string
            details:
              type: array
              description: Present on VALIDATION_ERROR only.
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
