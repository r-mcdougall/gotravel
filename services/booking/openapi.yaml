openapi: 3.1.0
info:
  title: GoTravel Booking API
  version: 1.1.0
  description: >
    Seat and hotel room holds, the booking lifecycle and booking analytics for
    admins. Every
    route requires an access token issued by the auth service. A booking
    belongs to the user in the token; other users' bookings are reported as
    not found. Times are in UTC.

tags:
  - name: bookings
    description: Flight seat holds and bookings of the signed-in user.
  - name: hotel-bookings
    description: Hotel room holds and bookings of the signed-in user.
  - name: admin
    description: Booking analytics. Requires the `admin` role.
  - name: internal
    description: >
      Routes for other services. The gateway does not route `/internal`, so
      they are reachable only inside the Docker network.

servers:
  - url: http://localhost:8080
    description: Local gateway

security:
  - bearerAuth: []

paths:
  /api/v1/bookings:
    post:
      tags: [bookings]
      summary: Hold seats
      description: >
        Reserves one seat per passenger on an upcoming flight and returns a
        `HELD` booking. The hold expires at `expires_at` (15 minutes by
        default) unless it is paid. The seat price is fixed when the hold is
        made. Seats are reserved atomically, so two holds never share a seat.
        A flight is known to booking once the catalog has published it.
      operationId: holdSeats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldRequest"
      responses:
        "201":
          description: Seats held.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No flight has this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: NOT_FOUND
                  message: flight not found
        "409":
          description: >
            The flight has already departed (`FLIGHT_DEPARTED`), or it has
            fewer free seats than passengers (`NOT_ENOUGH_SEATS`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                flightDeparted:
                  summary: The flight has already departed
                  value:
                    error:
                      code: FLIGHT_DEPARTED
                      message: the flight has already departed
                notEnoughSeats:
                  summary: Not enough free seats for every passenger
                  value:
                    error:
                      code: NOT_ENOUGH_SEATS
                      message: not enough seats are available for every passenger
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [bookings]
      summary: List my bookings
      description: Bookings of the signed-in user in every status, newest first.
      operationId: listBookings
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A page of bookings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/bookings/{id}:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    get:
      tags: [bookings]
      summary: Get a booking
      operationId: getBooking
      responses:
        "200":
          description: The booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/bookings/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    post:
      tags: [bookings]
      summary: Cancel a hold
      description: >
        Cancels a `HELD` booking and releases its seats. Confirmed, expired
        and cancelled bookings cannot be cancelled.
      operationId: cancelBooking
      responses:
        "200":
          description: The cancelled booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The booking is not held.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: BOOKING_NOT_HELD
                  message: only a held booking can be cancelled
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/hotel-bookings:
    post:
      tags: [hotel-bookings]
      summary: Hold a room
      description: >
        Reserves one room of a room type for every night of the stay, from
        `check_in` to the night before `check_out`, and returns a `HELD` hotel
        booking. The hold expires at `expires_at` (15 minutes by default)
        unless it is paid. The price per night is fixed when the hold is made.
        All nights are taken in one transaction: if any night has no free room,
        nothing is held. A room type is known to booking once the catalog has
        published it.
      operationId: holdRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HotelHoldRequest"
      responses:
        "201":
          description: Room held.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelBooking"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No room type has this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: NOT_FOUND
                  message: room type not found
        "409":
          description: At least one night of the stay has no free room of this type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: ROOMS_UNAVAILABLE
                  message: no room of this type is free on every night of the stay
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [hotel-bookings]
      summary: List my hotel bookings
      description: Hotel bookings of the signed-in user in every status, newest first.
      operationId: listHotelBookings
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A page of hotel bookings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelBookingList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/hotel-bookings/{id}:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    get:
      tags: [hotel-bookings]
      summary: Get a hotel booking
      operationId: getHotelBooking
      responses:
        "200":
          description: The hotel booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelBooking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/hotel-bookings/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    post:
      tags: [hotel-bookings]
      summary: Cancel a room hold
      description: >
        Cancels a `HELD` hotel booking and releases the room on every night of
        the stay. Confirmed, expired and cancelled bookings cannot be cancelled.
      operationId: cancelHotelBooking
      responses:
        "200":
          description: The cancelled hotel booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelBooking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The booking is not held.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: BOOKING_NOT_HELD
                  message: only a held booking can be cancelled
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/admin/analytics/bookings:
    get:
      tags: [admin]
      summary: Booking analytics
      description: >
        Summarizes the bookings created in a period of whole UTC days, from
        00:00 of `from` to 24:00 of `to`: bookings per status, revenue from
        confirmed bookings, and the 10 routes with the most confirmed bookings
        (ties go to more seats, then route codes). Without dates, the period is
        the 30 days up to today.
      operationId: getBookingAnalytics
      parameters:
        - name: from
          in: query
          description: First day of the period. Defaults to 29 days before `to`.
          schema:
            type: string
            format: date
          example: "2026-11-01"
        - name: to
          in: query
          description: >
            Last day of the period, at most 365 days after `from`. Defaults to
            today in UTC.
          schema:
            type: string
            format: date
          example: "2026-11-19"
      responses:
        "200":
          description: The summary of the period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analytics"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The access token does not have the `admin` role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: FORBIDDEN
                  message: insufficient permissions
        "500":
          $ref: "#/components/responses/InternalError"

  /internal/v1/bills/{id}:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    get:
      tags: [internal]
      summary: Bill of a booking
      description: >
        What the payment service needs to charge a flight or hotel booking of
        the signed-in user. Payment calls it with the paying user's own token.
        It reports the booking in any status; payment decides whether it can be
        paid.
      operationId: getBill
      responses:
        "200":
          description: The bill.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /internal/v1/flights/{id}/seats:
    get:
      tags: [internal]
      summary: Seats of a flight
      description: >
        The seat counters of a flight's inventory. The catalog service calls it
        with the admin's own token before it lowers a capacity. Requires the
        `admin` role.
      operationId: getFlightSeats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The seat counters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlightSeats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The access token does not have the `admin` role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: FORBIDDEN
                  message: insufficient permissions
        "404":
          description: Booking has not received this flight from the catalog yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: NOT_FOUND
                  message: flight not found
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BookingId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Malformed JSON, unknown field, or an invalid value in the body or the query string.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_ERROR
              message: request validation failed
              details:
                - field: passengers[0].birth_date
                  message: must be a past date in YYYY-MM-DD format
    Unauthorized:
      description: Access token is missing, invalid or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAUTHORIZED
              message: missing or invalid access token
    NotFound:
      description: >
        The signed-in user has no booking with this id. Bookings of other users
        and malformed ids are also reported as not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: NOT_FOUND
              message: booking not found
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INTERNAL_ERROR
              message: internal server error

  schemas:
    HoldRequest:
      type: object
      additionalProperties: false
      required: [flight_id, passengers]
      properties:
        flight_id:
          type: string
          format: uuid
        passengers:
          type: array
          minItems: 1
          maxItems: 9
          description: One seat is held per passenger.
          items:
            $ref: "#/components/schemas/PassengerRequest"

    PassengerRequest:
      type: object
      additionalProperties: false
      required: [full_name, birth_date]
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 100
          description: Surrounding spaces are trimmed.
          example: Jane Smith
        birth_date:
          type: string
          format: date
          description: Not in the future.
          example: "1992-08-03"

    Passenger:
      type: object
      required: [full_name, birth_date]
      properties:
        full_name:
          type: string
          example: Jane Smith
        birth_date:
          type: string
          format: date
          example: "1992-08-03"

    BookingStatus:
      type: string
      description: >
        `HELD` until paid, cancelled or expired. `CONFIRMED` and `EXPIRED` are
        set by the payment flow and the hold expirer.
      enum: [HELD, CONFIRMED, EXPIRED, CANCELLED]

    BookingFlight:
      type: object
      required:
        - id
        - flight_number
        - airline_code
        - origin_code
        - destination_code
        - departure_at
        - arrival_at
      properties:
        id:
          type: string
          format: uuid
        flight_number:
          type: string
          example: GA410
        airline_code:
          type: string
          example: GA
        origin_code:
          type: string
          example: CGK
        destination_code:
          type: string
          example: DPS
        departure_at:
          type: string
          format: date-time
          example: "2026-11-19T23:00:00Z"
        arrival_at:
          type: string
          format: date-time
          example: "2026-11-20T00:55:00Z"

    Booking:
      type: object
      required:
        - id
        - status
        - flight
        - passengers
        - passenger_count
        - seat_price
        - total_price
        - expires_at
        - payment_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/BookingStatus"
        flight:
          $ref: "#/components/schemas/BookingFlight"
        passengers:
          type: array
          items:
            $ref: "#/components/schemas/Passenger"
        passenger_count:
          type: integer
          example: 2
        seat_price:
          type: integer
          format: int64
          description: Price per seat in rupiah, fixed when the hold was made.
          example: 1250000
        total_price:
          type: integer
          format: int64
          description: "`seat_price` times `passenger_count`."
          example: 2500000
        expires_at:
          type: string
          format: date-time
          description: When an unpaid hold expires.
        payment_id:
          type: [string, "null"]
          format: uuid
          description: The payment that confirmed the booking; null until it is `CONFIRMED`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    HotelHoldRequest:
      type: object
      additionalProperties: false
      required: [room_type_id, check_in, check_out, guests, guest_name]
      properties:
        room_type_id:
          type: string
          format: uuid
        check_in:
          type: string
          format: date
          description: Not before today in UTC.
          example: "2026-12-01"
        check_out:
          type: string
          format: date
          description: >
            After `check_in` and at most 14 nights later. The room is not held
            on this night.
          example: "2026-12-04"
        guests:
          type: integer
          minimum: 1
          maximum: 10
          description: At most the `max_guests` of the room type.
          example: 2
        guest_name:
          type: string
          minLength: 1
          maxLength: 100
          description: Surrounding spaces are trimmed.
          example: John Doe

    HotelBooking:
      type: object
      required:
        - id
        - status
        - hotel
        - room_type
        - check_in
        - check_out
        - nights
        - guests
        - guest_name
        - price_per_night
        - total_price
        - expires_at
        - payment_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/BookingStatus"
        hotel:
          type: object
          required: [id, name, city_code]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              example: Seminyak Garden Hotel
            city_code:
              type: string
              example: DPS
        room_type:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              example: Deluxe King
        check_in:
          type: string
          format: date
          example: "2026-12-01"
        check_out:
          type: string
          format: date
          example: "2026-12-04"
        nights:
          type: integer
          format: int64
          example: 3
        guests:
          type: integer
          example: 2
        guest_name:
          type: string
          example: John Doe
        price_per_night:
          type: integer
          format: int64
          description: Price per night in rupiah, fixed when the hold was made.
          example: 1500000
        total_price:
          type: integer
          format: int64
          description: "`price_per_night` times `nights`."
          example: 4500000
        expires_at:
          type: string
          format: date-time
          description: When an unpaid hold expires.
        payment_id:
          type: [string, "null"]
          format: uuid
          description: The payment that confirmed the booking; null until it is `CONFIRMED`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    HotelBookingList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/HotelBooking"
        meta:
          $ref: "#/components/schemas/PageMeta"

    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          description: Number of the user's bookings of this kind across all pages.

    BookingList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        meta:
          $ref: "#/components/schemas/PageMeta"

    Analytics:
      type: object
      required: [from, to, bookings_by_status, revenue, top_routes]
      properties:
        from:
          type: string
          format: date
          example: "2026-10-21"
        to:
          type: string
          format: date
          example: "2026-11-19"
        bookings_by_status:
          type: object
          description: Bookings created in the period, by their current status.
          required: [HELD, CONFIRMED, EXPIRED, CANCELLED]
          properties:
            HELD:
              type: integer
              format: int64
              example: 3
            CONFIRMED:
              type: integer
              format: int64
              example: 42
            EXPIRED:
              type: integer
              format: int64
              example: 11
            CANCELLED:
              type: integer
              format: int64
              example: 5
        revenue:
          type: integer
          format: int64
          description: Total price in rupiah of the confirmed bookings.
          example: 63500000
        top_routes:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/RouteSummary"

    Bill:
      type: object
      required: [id, status, total_price, expires_at]
      properties:
        id:
          type: string
          format: uuid
          description: The id of a flight or hotel booking.
        status:
          $ref: "#/components/schemas/BookingStatus"
        total_price:
          type: integer
          format: int64
          description: The `total_price` of the booking in rupiah.
          example: 4500000
        expires_at:
          type: string
          format: date-time
          description: When an unpaid hold expires.

    FlightSeats:
      type: object
      required: [flight_id, capacity, held_seats, sold_seats]
      properties:
        flight_id:
          type: string
          format: uuid
        capacity:
          type: integer
          format: int32
          example: 180
        held_seats:
          type: integer
          format: int32
          description: Seats of `HELD` bookings.
          example: 5
        sold_seats:
          type: integer
          format: int32
          description: Seats of `CONFIRMED` bookings.
          example: 140

    RouteSummary:
      type: object
      required: [origin_code, destination_code, bookings, seats, revenue]
      properties:
        origin_code:
          type: string
          example: CGK
        destination_code:
          type: string
          example: DPS
        bookings:
          type: integer
          format: int64
          description: Confirmed bookings.
          example: 18
        seats:
          type: integer
          format: int64
          description: Passengers of the confirmed bookings.
          example: 31
        revenue:
          type: integer
          format: int64
          description: Total price in rupiah of the confirmed bookings.
          example: 27900000

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - FLIGHT_DEPARTED
                - NOT_ENOUGH_SEATS
                - ROOMS_UNAVAILABLE
                - BOOKING_NOT_HELD
                - INTERNAL_ERROR
            message:
              type: string
            details:
              type: array
              description: Present on VALIDATION_ERROR only.
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
