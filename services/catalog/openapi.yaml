openapi: 3.1.0
info:
  title: GoTravel Catalog API
  version: 1.0.0
  description: >
    Flight search and detail are public. Flight inventory management lives
    under `/api/v1/admin` and requires an access token issued by the auth
    service for a user with role `admin`.

tags:
  - name: flights
    description: Public flight search.
  - name: admin
    description: Flight inventory management.

servers:
  - url: http://localhost:8080
    description: Local gateway

paths:
  /api/v1/flights:
    get:
      tags: [flights]
      summary: Search flights
      description: >
        Returns the direct, one-way flights from `origin` to `destination`
        that depart on `date` (the calendar date at the origin airport) and
        have not departed yet. A past date, or an airport with no flights,
        gives an empty list. Filters combine with AND. Departure times are
        local to the origin airport, with no wrap past midnight.
        `available_seats` is as last reported by the booking service and can
        lag behind new holds, so a hold is what finally reserves seats.
      operationId: searchFlights
      security: []
      parameters:
        - name: origin
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AirportCode"
        - name: destination
          in: query
          required: true
          description: Must differ from `origin`.
          schema:
            $ref: "#/components/schemas/AirportCode"
        - name: date
          in: query
          required: true
          description: Local departure date at the origin airport.
          schema:
            type: string
            format: date
          example: "2026-11-20"
        - name: passengers
          in: query
          description: Only flights with at least this many seats left.
          schema:
            type: integer
            minimum: 1
            maximum: 9
            default: 1
        - name: airlines
          in: query
          description: Comma separated airline codes. An unknown code matches nothing.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AirlineCode"
          example: GA,JT
        - name: min_price
          in: query
          description: Lowest price per passenger in rupiah.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: max_price
          in: query
          description: Highest price per passenger in rupiah; not below `min_price`.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: departure_from
          in: query
          description: Earliest local departure time at the origin airport.
          schema:
            $ref: "#/components/schemas/TimeOfDay"
        - name: departure_to
          in: query
          description: Latest local departure time; not before `departure_from`.
          schema:
            $ref: "#/components/schemas/TimeOfDay"
        - name: sort
          in: query
          description: >
            Flights that tie are ordered by departure time, earliest first,
            then by id.
          schema:
            type: string
            enum: [departure_asc, departure_desc, price_asc, price_desc]
            default: departure_asc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A page of flights.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlightList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/flights/{id}:
    parameters:
      - $ref: "#/components/parameters/FlightId"
    get:
      tags: [flights]
      summary: Get a flight
      description: Also returns flights that have already departed.
      operationId: getFlight
      security: []
      responses:
        "200":
          description: The flight.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flight"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/admin/flights:
    get:
      tags: [admin]
      summary: List flights
      description: >
        Includes flights that have already departed. Ordered by departure
        time, newest first. The `date` filter is the calendar date at the
        origin airport.
      operationId: adminListFlights
      security:
        - bearerAuth: []
      parameters:
        - name: origin
          in: query
          schema:
            $ref: "#/components/schemas/AirportCode"
        - name: destination
          in: query
          schema:
            $ref: "#/components/schemas/AirportCode"
        - name: date
          in: query
          description: Local departure date at the origin airport.
          schema:
            type: string
            format: date
          example: "2026-11-20"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A page of flights.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFlightList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [admin]
      summary: Create a flight
      description: >
        `available_seats` starts equal to `capacity`. Creating a flight also
        records a `flight.changed` event for the booking service.
      operationId: adminCreateFlight
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFlightRequest"
      responses:
        "201":
          description: Flight created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFlight"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >
            A flight with the same airline, flight number and departure time
            already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: FLIGHT_EXISTS
                  message: flight already exists for this departure time
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/admin/flights/{id}:
    parameters:
      - $ref: "#/components/parameters/FlightId"
    get:
      tags: [admin]
      summary: Get a flight
      operationId: adminGetFlight
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The flight.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFlight"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [admin]
      summary: Update a flight
      description: >
        Only the schedule, price and capacity can be changed; flight number,
        airline and route are fixed once created, and sending them is
        rejected as an unknown field. Omitted fields are left unchanged, but
        at least one field is required, and `departure_at` and `arrival_at`
        must be sent together. Changing `capacity` moves `available_seats` by
        the same amount. Prices of existing holds are not affected. Every
        update records a `flight.changed` event for the booking service.
      operationId: adminUpdateFlight
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFlightRequest"
      responses:
        "200":
          description: Updated flight.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFlight"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            Either the new schedule collides with an existing flight
            (`FLIGHT_EXISTS`), or the new capacity is lower than the number
            of seats already sold (`CAPACITY_BELOW_SOLD`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                flightExists:
                  summary: Schedule collides with an existing flight
                  value:
                    error:
                      code: FLIGHT_EXISTS
                      message: flight already exists for this departure time
                capacityBelowSold:
                  summary: Capacity is lower than the seats already sold
                  value:
                    error:
                      code: CAPACITY_BELOW_SOLD
                      message: capacity is lower than the number of seats already sold
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    FlightId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Malformed JSON, unknown field, or an invalid value in the body or the query string.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_ERROR
              message: request validation failed
              details:
                - field: airline_code
                  message: unknown airline
    Unauthorized:
      description: Access token is missing, invalid or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAUTHORIZED
              message: missing or invalid access token
    Forbidden:
      description: The user is not an administrator.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: FORBIDDEN
              message: insufficient permissions
    NotFound:
      description: No flight has this id. A malformed id is also reported as not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: NOT_FOUND
              message: flight not found
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INTERNAL_ERROR
              message: internal server error

  schemas:
    AirportCode:
      type: string
      pattern: "^[A-Z]{3}$"
      description: IATA airport code, upper case.
      example: CGK

    AirlineCode:
      type: string
      pattern: "^[A-Z0-9]{2}$"
      description: IATA airline code, upper case.
      example: GA

    TimeOfDay:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: Local time of day, 24 hour clock.
      example: "06:00"

    CreateFlightRequest:
      type: object
      additionalProperties: false
      required:
        - flight_number
        - airline_code
        - origin_code
        - destination_code
        - departure_at
        - arrival_at
        - price
        - capacity
      properties:
        flight_number:
          type: string
          pattern: "^[A-Z0-9]{2}[0-9]{1,4}$"
          description: Must start with the airline code.
          example: GA410
        airline_code:
          $ref: "#/components/schemas/AirlineCode"
        origin_code:
          $ref: "#/components/schemas/AirportCode"
        destination_code:
          description: Must differ from `origin_code`.
          $ref: "#/components/schemas/AirportCode"
        departure_at:
          type: string
          format: date-time
          description: RFC 3339 with an explicit UTC offset.
          example: "2026-11-20T06:00:00+07:00"
        arrival_at:
          type: string
          format: date-time
          description: RFC 3339 with an explicit UTC offset, after `departure_at`.
          example: "2026-11-20T08:55:00+08:00"
        price:
          type: integer
          format: int64
          minimum: 1
          description: Price per passenger in rupiah.
          example: 1250000
        capacity:
          type: integer
          format: int32
          minimum: 1
          example: 180

    UpdateFlightRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      dependentRequired:
        departure_at: [arrival_at]
        arrival_at: [departure_at]
      properties:
        departure_at:
          type: string
          format: date-time
          description: RFC 3339 with an explicit UTC offset. Requires `arrival_at`.
        arrival_at:
          type: string
          format: date-time
          description: >
            RFC 3339 with an explicit UTC offset, after `departure_at`.
            Requires `departure_at`.
        price:
          type: integer
          format: int64
          minimum: 1
          description: Price per passenger in rupiah.
        capacity:
          type: integer
          format: int32
          minimum: 1
          description: Must not be lower than the number of seats already sold.

    Airline:
      type: object
      required: [code, name]
      properties:
        code:
          $ref: "#/components/schemas/AirlineCode"
        name:
          type: string
          example: Garuda Indonesia

    Airport:
      type: object
      required: [code, name, city]
      properties:
        code:
          $ref: "#/components/schemas/AirportCode"
        name:
          type: string
          example: Soekarno-Hatta International Airport
        city:
          type: string
          example: Jakarta

    Flight:
      type: object
      required:
        - id
        - flight_number
        - airline
        - origin
        - destination
        - departure_at
        - arrival_at
        - duration_minutes
        - price
        - available_seats
      properties:
        id:
          type: string
          format: uuid
        flight_number:
          type: string
          example: GA410
        airline:
          $ref: "#/components/schemas/Airline"
        origin:
          $ref: "#/components/schemas/Airport"
        destination:
          $ref: "#/components/schemas/Airport"
        departure_at:
          type: string
          format: date-time
          description: Local time at the origin airport, with its UTC offset.
          example: "2026-11-20T06:00:00+07:00"
        arrival_at:
          type: string
          format: date-time
          description: Local time at the destination airport, with its UTC offset.
          example: "2026-11-20T08:55:00+08:00"
        duration_minutes:
          type: integer
          example: 115
        price:
          type: integer
          format: int64
          description: Price per passenger in rupiah.
          example: 1250000
        available_seats:
          type: integer
          description: >
            Seats still open, as last reported by the booking service. It can
            lag behind new holds.
          example: 42

    AdminFlight:
      allOf:
        - $ref: "#/components/schemas/Flight"
        - type: object
          required: [capacity, created_at, updated_at]
          properties:
            capacity:
              type: integer
              example: 180
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          description: Number of flights matching the filters across all pages.

    FlightList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Flight"
        meta:
          $ref: "#/components/schemas/PageMeta"

    AdminFlightList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminFlight"
        meta:
          $ref: "#/components/schemas/PageMeta"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - FLIGHT_EXISTS
                - CAPACITY_BELOW_SOLD
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - INTERNAL_ERROR
            message:
              type: string
            details:
              type: array
              description: Present on VALIDATION_ERROR only.
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
