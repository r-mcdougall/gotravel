openapi: 3.1.0
info:
  title: GoTravel Catalog API
  version: 1.0.0
  description: >
    Flight inventory management for administrators. Public flight search is
    documented here once it is implemented. All endpoints below require an
    access token issued by the auth service for a user with role `admin`.

tags:
  - name: admin

servers:
  - url: http://localhost:8080
    description: Local gateway

paths:
  /api/v1/admin/flights:
    get:
      tags: [admin]
      summary: List flights
      description: >
        Includes flights that have already departed. Ordered by departure
        time, newest first. The `date` filter is the calendar date at the
        origin airport.
      operationId: adminListFlights
      security:
        - bearerAuth: []
      parameters:
        - name: origin
          in: query
          schema:
            $ref: "#/components/schemas/AirportCode"
        - name: destination
          in: query
          schema:
            $ref: "#/components/schemas/AirportCode"
        - name: date
          in: query
          description: Local departure date at the origin airport.
          schema:
            type: string
            format: date
          example: "2026-11-20"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A page of flights.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFlightList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [admin]
      summary: Create a flight
      description: >
        `available_seats` starts equal to `capacity`. Creating a flight also
        records a `flight.changed` event for the booking service.
      operationId: adminCreateFlight
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFlightRequest"
      responses:
        "201":
          description: Flight created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFlight"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >
            A flight with the same airline, flight number and departure time
            already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: FLIGHT_EXISTS
                  message: flight already exists for this departure time
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/admin/flights/{id}:
    parameters:
      - $ref: "#/components/parameters/FlightId"
    get:
      tags: [admin]
      summary: Get a flight
      operationId: adminGetFlight
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The flight.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFlight"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [admin]
      summary: Update a flight
      description: >
        Only the schedule, price and capacity can be changed; flight number,
        airline and route are fixed once created, and sending them is
        rejected as an unknown field. Omitted fields are left unchanged, but
        at least one field is required, and `departure_at` and `arrival_at`
        must be sent together. Changing `capacity` moves `available_seats` by
        the same amount. Prices of existing holds are not affected. Every
        update records a `flight.changed` event for the booking service.
      operationId: adminUpdateFlight
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFlightRequest"
      responses:
        "200":
          description: Updated flight.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFlight"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            Either the new schedule collides with an existing flight
            (`FLIGHT_EXISTS`), or the new capacity is lower than the number
            of seats already sold (`CAPACITY_BELOW_SOLD`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                flightExists:
                  summary: Schedule collides with an existing flight
                  value:
                    error:
                      code: FLIGHT_EXISTS
                      message: flight already exists for this departure time
                capacityBelowSold:
                  summary: Capacity is lower than the seats already sold
                  value:
                    error:
                      code: CAPACITY_BELOW_SOLD
                      message: capacity is lower than the number of seats already sold
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    FlightId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Malformed JSON, unknown field or invalid value.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_ERROR
              message: request validation failed
              details:
                - field: airline_code
                  message: unknown airline
    Unauthorized:
      description: Access token is missing, invalid or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAUTHORIZED
              message: missing or invalid access token
    Forbidden:
      description: The user is not an administrator.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: FORBIDDEN
              message: insufficient permissions
    NotFound:
      description: No flight has this id. A malformed id is also reported as not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: NOT_FOUND
              message: flight not found
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INTERNAL_ERROR
              message: internal server error

  schemas:
    AirportCode:
      type: string
      pattern: "^[A-Z]{3}$"
      description: IATA airport code, upper case.
      example: CGK

    AirlineCode:
      type: string
      pattern: "^[A-Z0-9]{2}$"
      description: IATA airline code, upper case.
      example: GA

    CreateFlightRequest:
      type: object
      additionalProperties: false
      required:
        - flight_number
        - airline_code
        - origin_code
        - destination_code
        - departure_at
        - arrival_at
        - price
        - capacity
      properties:
        flight_number:
          type: string
          pattern: "^[A-Z0-9]{2}[0-9]{1,4}$"
          description: Must start with the airline code.
          example: GA410
        airline_code:
          $ref: "#/components/schemas/AirlineCode"
        origin_code:
          $ref: "#/components/schemas/AirportCode"
        destination_code:
          description: Must differ from `origin_code`.
          $ref: "#/components/schemas/AirportCode"
        departure_at:
          type: string
          format: date-time
          description: RFC 3339 with an explicit UTC offset.
          example: "2026-11-20T06:00:00+07:00"
        arrival_at:
          type: string
          format: date-time
          description: RFC 3339 with an explicit UTC offset, after `departure_at`.
          example: "2026-11-20T08:55:00+08:00"
        price:
          type: integer
          format: int64
          minimum: 1
          description: Price per passenger in rupiah.
          example: 1250000
        capacity:
          type: integer
          format: int32
          minimum: 1
          example: 180

    UpdateFlightRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      dependentRequired:
        departure_at: [arrival_at]
        arrival_at: [departure_at]
      properties:
        departure_at:
          type: string
          format: date-time
          description: RFC 3339 with an explicit UTC offset. Requires `arrival_at`.
        arrival_at:
          type: string
          format: date-time
          description: >
            RFC 3339 with an explicit UTC offset, after `departure_at`.
            Requires `departure_at`.
        price:
          type: integer
          format: int64
          minimum: 1
          description: Price per passenger in rupiah.
        capacity:
          type: integer
          format: int32
          minimum: 1
          description: Must not be lower than the number of seats already sold.

    Airline:
      type: object
      required: [code, name]
      properties:
        code:
          $ref: "#/components/schemas/AirlineCode"
        name:
          type: string
          example: Garuda Indonesia

    Airport:
      type: object
      required: [code, name, city]
      properties:
        code:
          $ref: "#/components/schemas/AirportCode"
        name:
          type: string
          example: Soekarno-Hatta International Airport
        city:
          type: string
          example: Jakarta

    AdminFlight:
      type: object
      required:
        - id
        - flight_number
        - airline
        - origin
        - destination
        - departure_at
        - arrival_at
        - duration_minutes
        - price
        - capacity
        - available_seats
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        flight_number:
          type: string
          example: GA410
        airline:
          $ref: "#/components/schemas/Airline"
        origin:
          $ref: "#/components/schemas/Airport"
        destination:
          $ref: "#/components/schemas/Airport"
        departure_at:
          type: string
          format: date-time
          description: Local time at the origin airport, with its UTC offset.
          example: "2026-11-20T06:00:00+07:00"
        arrival_at:
          type: string
          format: date-time
          description: Local time at the destination airport, with its UTC offset.
          example: "2026-11-20T08:55:00+08:00"
        duration_minutes:
          type: integer
          example: 115
        price:
          type: integer
          format: int64
          description: Price per passenger in rupiah.
          example: 1250000
        capacity:
          type: integer
          example: 180
        available_seats:
          type: integer
          description: >
            Seats still open, as last reported by the booking service. It can
            lag behind new holds.
          example: 42
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          description: Number of flights matching the filters across all pages.

    AdminFlightList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminFlight"
        meta:
          $ref: "#/components/schemas/PageMeta"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - FLIGHT_EXISTS
                - CAPACITY_BELOW_SOLD
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - INTERNAL_ERROR
            message:
              type: string
            details:
              type: array
              description: Present on VALIDATION_ERROR only.
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
